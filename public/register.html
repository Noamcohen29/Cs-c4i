<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS C4I - User Registration</title>
    <style>
        :root {
            --primary-blue: #004b87;
            --light-blue: #e6f0fa;
            --text-dark: #333333;
            --text-light: #666666;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .header {
            background-color: var(--primary-blue);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 14px;
            color: #cce0ff;
        }

        form {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background-color: #fdfdfd;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px var(--light-blue);
        }

        .form-control:disabled {
            background-color: #f1f5f9;
            color: var(--text-light);
            cursor: not-allowed;
        }

        .toggle-group {
            display: flex;
            gap: 10px;
        }

        .toggle-option {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            background-color: #fdfdfd;
            transition: border-color 0.2s, background-color 0.2s;
            user-select: none;
        }

        .toggle-option.active {
            border-color: var(--primary-blue);
            background-color: var(--light-blue);
            color: var(--primary-blue);
        }

        .submit-btn {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #003865;
        }

        .submit-btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CS C4I Help Desk</h1>
        <p>User Registration & Verification</p>
    </div>

    <form id="registrationForm">
        <div class="form-group">
            <label for="phone">WhatsApp Number</label>
            <input type="text" id="phone" class="form-control" disabled>
        </div>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
            <label>Registration Type</label>
            <div class="toggle-group" role="tablist" aria-label="Registration Type">
                <div class="toggle-option active" id="typeEmployee" data-value="elbit_employee" role="tab" aria-selected="true">Elbit Employee</div>
                <div class="toggle-option" id="typeCustomer" data-value="customer" role="tab" aria-selected="false">Customer</div>
            </div>
            <input type="hidden" id="registrationType" value="elbit_employee">
        </div>

        <div class="form-group">
            <label for="email">Work Email</label>
            <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
        </div>

        <div class="form-group" id="employeeIdGroup">
            <label for="employeeId">Employee ID</label>
            <input type="text" id="employeeId" class="form-control" placeholder="e.g. E123456" required>
        </div>

        <div class="form-group" id="roleSelectGroup" style="display: none;">
            <label for="roleSelect">My Role / Job Title</label>
            <select id="roleSelect" class="form-control">
                <option value="">Select a role</option>
                <option value="Customer">Customer</option>
                <option value="Operations">Operations</option>
                <option value="Procurement">Procurement</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group" id="roleDescriptionGroup">
            <label for="roleDescription">My Role / Job Title</label>
            <input type="text" id="roleDescription" class="form-control" placeholder="e.g. Field Technician, PM" required>
        </div>

        <div class="form-group">
            <label for="country">Country of Operation</label>
            <input list="countryList" id="country" class="form-control" placeholder="Type to search or select..." autocomplete="off" required>
            <datalist id="countryList"></datalist>
        </div>

        <div class="form-group">
            <label for="language">Preferred Support Language</label>
            <input list="languageList" id="language" class="form-control" placeholder="Type to search or select..." autocomplete="off" required>
            <datalist id="languageList"></datalist>
        </div>

        <button type="submit" class="submit-btn">Complete Registration</button>
    </form>

    <div class="footer">
        Secured by CS C4I System Portal &copy; 2026
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Token decoding logic
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            try {
                const phoneNumber = atob(token);
                document.getElementById('phone').value = phoneNumber;
            } catch (e) {
                console.error("Invalid token format");
                document.getElementById('phone').value = "Error reading number";
            }
        }

        // 2. Fetch Countries and Languages
        const countryList = document.getElementById('countryList');
        const languageList = document.getElementById('languageList');
        const languageInput = document.getElementById('language');

        try {
            const response = await fetch('https://restcountries.com/v3.1/all?fields=name,languages');
            const data = await response.json();

            const countries = data.map(item => item.name.common).sort((a, b) => a.localeCompare(b));
            
            const languageSet = new Set();
            data.forEach(item => {
                if (item.languages) {
                    Object.values(item.languages).forEach(lang => languageSet.add(lang));
                }
            });
            const languages = Array.from(languageSet).sort((a, b) => a.localeCompare(b));

            countries.forEach(country => {
                const option = document.createElement('option');
                option.value = country;
                countryList.appendChild(option);
            });

            languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang;
                languageList.appendChild(option);
            });

            languageInput.value = "English";

        } catch (error) {
            console.error("Error fetching API data:", error);
            document.getElementById('country').placeholder = "Error loading list. Please type country.";
            document.getElementById('language').placeholder = "Error loading list. Please type language.";
        }
        // 3. Registration type toggle logic
        const typeEmployee = document.getElementById('typeEmployee');
        const typeCustomer = document.getElementById('typeCustomer');
        const registrationType = document.getElementById('registrationType');
        const employeeIdGroup = document.getElementById('employeeIdGroup');
        const roleSelectGroup = document.getElementById('roleSelectGroup');
        const roleDescriptionGroup = document.getElementById('roleDescriptionGroup');
        const employeeIdInput = document.getElementById('employeeId');
        const roleSelect = document.getElementById('roleSelect');
        const roleDescription = document.getElementById('roleDescription');

        const setRegistrationType = (type) => {
            const isEmployee = type === 'elbit_employee';
            registrationType.value = type;
            typeEmployee.classList.toggle('active', isEmployee);
            typeEmployee.setAttribute('aria-selected', String(isEmployee));
            typeCustomer.classList.toggle('active', !isEmployee);
            typeCustomer.setAttribute('aria-selected', String(!isEmployee));

            employeeIdGroup.style.display = isEmployee ? 'block' : 'none';
            roleDescriptionGroup.style.display = isEmployee ? 'block' : 'none';
            roleSelectGroup.style.display = isEmployee ? 'none' : 'block';

            employeeIdInput.required = isEmployee;
            roleDescription.required = isEmployee;
            roleSelect.required = !isEmployee;
        };

        typeEmployee.addEventListener('click', () => setRegistrationType('elbit_employee'));
        typeCustomer.addEventListener('click', () => setRegistrationType('customer'));
        setRegistrationType('elbit_employee');
    });

    // 3. Handle Form Submission to API
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        const submitBtn = document.querySelector('.submit-btn');
        const originalText = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving details...';
        
        const userData = {
            phone: document.getElementById('phone').value,
            name: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            role: document.getElementById('roleSelect').value || document.getElementById('roleDescription').value,
            country: document.getElementById('country').value,
            language: document.getElementById('language').value,
            registration_type: document.getElementById('registrationType').value,
            employee_id: document.getElementById('employeeId').value || null,
            role_description: document.getElementById('roleDescription').value || null,
            manager_approved: false
        };

        try {
            // החיבור האמיתי ל-API שיצרת
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            if (response.ok) {
                // המעבר לדף ההצלחה
                window.location.href = `success.html?name=${encodeURIComponent(userData.name)}`;
            } else {
                const errorData = await response.json();
                alert("Registration failed: " + (errorData.error || "Unknown error"));
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        } catch (error) {
            console.error("Network Error:", error);
            alert("Network error. Please try again.");
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        }
    });
</script>

</body>
</html>
